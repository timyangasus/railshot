name: Keep Railshot backend awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -s -o /dev/null -w "health check: HTTP %{http_code} in %{time_total}s\n" \
            https://railshot.onrender.com/api/health || echo "ping failed, will retry next cycle"
