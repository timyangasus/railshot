<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Railshot"/>
<meta name="theme-color" content="#1a2540"/>
<title>Railshot</title>
<link rel="apple-touch-icon" href="icon-512.png"/>
<link rel="manifest" href="manifest.json"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F2F2F7;
  --bg2:#ffffff;
  --bg3:#E8E8ED;
  --bg4:#dde6f5;
  --card:#ffffff;
  --card2:#f5f8ff;
  --border:#dde6f5;
  --border2:#c8d8ef;
  --text:#1a2540;
  --text2:#4a6080;
  --text3:#8a9db8;
  --accent:#1a2540;
  --accent-lt:#e8eaf0;
  --accent-lter:#eff0f4;
  --green:#1a9e5c;
  --green-lt:#e8f8ef;
  --red:#d43030;
  --red-lt:#fdeaea;
  --orange:#c06010;
  --orange-lt:#fff3e0;
  /* Train type badge colors */
  --exp3:#0077cc;      /* 自強3000: 藍色 */
  --exp3-lt:#deeeff;
  --puy:#cc2020;       /* 普悠瑪: 紅色 */
  --puy-lt:#fde8e8;
  --tze:#d44a00;       /* 太魯閣: 橘色 */
  --tze-lt:#fff0e8;
  --exp:#8a6400;       /* 自強: 深黃 */
  --exp-lt:#fff8d6;
  --moc:#c05800;       /* 莒光: 淺橘 */
  --moc-lt:#fff0e0;
  --localx:#5a8a00;    /* 區間快: 黃綠 */
  --localx-lt:#edf7d0;
  --local:#1a9e5c;     /* 區間: 綠色 */
  --local-lt:#e8f8ef;
  --shadow:0 1px 4px rgba(26,64,128,0.08);
  --shadow-md:0 2px 12px rgba(26,64,128,0.12);
  --tab-h:80px;
  --header-h:44px;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,20px);
  --radius:14px;
  --radius-sm:10px;
  --radius-xs:7px;
}
html,body{height:100%;background:#F2F2F7;color:var(--text);font-family:-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;overflow:hidden;}
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);}

/* ── SVG ICON SYSTEM ── */
.icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon svg{display:block;}

/* ── HEADER ── */
.header{height:calc(var(--header-h) + var(--safe-top));padding-top:var(--safe-top);background:var(--bg);border-bottom:none;display:flex;align-items:flex-end;flex-shrink:0;z-index:100;}
.header-inner{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 18px 8px;}
.logo-text{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-0.8px;}
.bell-btn{width:38px;height:38px;border-radius:50%;background:white;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--text2);transition:background .15s;box-shadow:var(--shadow);}
.bell-btn:active{background:var(--bg3);}
.bell-badge{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid white;display:none;}

/* ── TABS ── */
.tab-bar{
  height:calc(var(--tab-h) + var(--safe-bot));
  padding-bottom:var(--safe-bot);
  padding-top:8px;
  background:#F2F2F7;
  border-top:1px solid #d0d6e8;
  display:flex;
  align-items:flex-start;
  z-index:100;
  flex-shrink:0;
  /* 滿版貼底 */
  width:100%;
  box-sizing:border-box;
}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;color:var(--text3);transition:color .2s;}
.tab-item.active{color:var(--accent);}
.tab-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
.tab-label{font-size:10px;font-weight:500;letter-spacing:0.1px;}
.tab-active-bar{width:20px;height:2.5px;border-radius:2px;background:var(--accent);margin-top:1px;opacity:0;transition:opacity .2s;}
.tab-item.active .tab-active-bar{opacity:1;}

/* ── SCREENS ── */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none;flex-direction:column;}
.screen.active{display:flex;}
.sc{padding:14px 14px 20px;}

/* ── CHIPS ── */
.chips-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.chip-round{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--border2);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:17px;font-weight:700;color:var(--text2);flex-shrink:0;transition:all .15s;line-height:1.2;}
.chip-round *{pointer-events:none;}
.chip-round.on{background:var(--accent);border-color:var(--accent);color:white;}
.chip-round>div:last-child{font-size:12px;font-weight:500;opacity:0.8;}
.chips-row::-webkit-scrollbar{display:none;}
.chip{padding:9px 15px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid var(--border2);background:white;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;box-shadow:var(--shadow);}
.chip.on{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 2px 8px rgba(26,37,64,0.25);}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.sec{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.7px;text-transform:uppercase;margin-bottom:7px;margin-top:14px;}
.sec:first-child{margin-top:0;}

/* ── LOCATION BAR ── */
.loc-bar{background:white;border-radius:var(--radius);border:1px solid var(--border);padding:18px 16px;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
.loc-bar:active{background:var(--bg3);}
.loc-name{font-size:17px;font-weight:700;color:var(--text);}
.loc-mode{font-size:12px;color:var(--text3);margin-top:3px;}

/* ── BADGE COLORS ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:0.1px;}
.b-exp3{background:var(--exp3-lt);color:var(--exp3);}
.b-puy{background:var(--puy-lt);color:var(--puy);}
.b-tze{background:var(--tze-lt);color:var(--tze);}
.b-exp{background:var(--exp-lt);color:var(--exp);}
.b-moc{background:var(--moc-lt);color:var(--moc);}
.b-localx{background:var(--localx-lt);color:var(--localx);}
.b-local{background:var(--local-lt);color:var(--local);}

/* ── TRAIN CARD ── */
.train-card{background:white;border-radius:var(--radius);border:1px solid var(--border);padding:14px 15px;margin-bottom:9px;cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .15s,border-color .15s;box-shadow:var(--shadow);}
.train-card:active{background:var(--bg);}
.train-card::before{display:none;}
.dir-up::before{display:none;}
.dir-down::before{display:none;}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;}
.tc-time{font-size:32px;font-weight:750;letter-spacing:-1px;line-height:1;color:var(--text);}
.tc-cd{border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;}
.tc-cd.wait{background:var(--accent-lt);color:var(--accent);}
.tc-cd.soon{background:var(--red-lt);color:var(--red);}
.tc-cd.passed{background:var(--bg3);color:var(--text3);}
.tc-mid{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap;}
.dir-tag{font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600;}
.dir-tag.up{background:#e6f1ff;color:#3992FF;}
.dir-tag.down{background:#e6f9f1;color:#27C97A;}
.tc-route{font-size:13px;color:var(--text2);margin-bottom:5px;}
.tc-bot{display:flex;align-items:center;justify-content:space-between;}
.tc-loc{font-size:12px;color:var(--text3);}
.tc-delay{font-size:12px;font-weight:600;color:var(--orange);}
.tc-ok{font-size:12px;font-weight:500;color:var(--green);}
.tno{font-size:13px;font-weight:600;color:var(--text);}
.rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.rt{font-size:14px;font-weight:600;color:var(--text2);}
.rc{font-size:13px;color:var(--text3);}

/* ── SHEET ── */
.sheet-ov{position:absolute;inset:0;background:rgba(30,50,90,0.35);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(2px);}
.sheet-ov.open{display:flex;}
.sheet{background:white;border-radius:22px 22px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding-bottom:calc(16px + var(--safe-bot));}
.sh-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;}
.sh-hdr{padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.sh-title{font-size:17px;font-weight:700;color:var(--text);}
.sh-close{width:30px;height:30px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);}
.sh-body{padding:14px 18px;}

/* ── STATION PICKER ── */
/* ── LOC SHEET: compact mode tabs ── */
.loc-mode-row{
  display:flex;gap:6px;margin-bottom:16px;
}
.loc-mode-tab{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:14px 4px;border-radius:8px;font-size:13px;font-weight:500;
  font-family:inherit;cursor:pointer;
  border:1.5px solid var(--border2);background:white;color:var(--text2);
  transition:all .15s;
}
.loc-mode-tab svg{flex-shrink:0;}
.loc-mode-tab.active{
  background:var(--accent);color:white;border-color:var(--accent);
  font-weight:600;box-shadow:0 2px 6px rgba(26,37,64,0.25);
}

/* Large station selector button */
.loc-stn-big-btn{
  width:100%;display:flex;align-items:center;gap:14px;
  padding:18px 16px;background:var(--bg);
  border:1.5px solid var(--border2);border-radius:var(--radius);
  cursor:pointer;font-family:inherit;text-align:left;
  transition:border-color .15s,background .15s;
}
.loc-stn-big-btn:active{background:var(--bg3);}
.loc-stn-big-btn:has(.loc-stn-big-name:not(:empty)):not([data-empty]){
  border-color:var(--accent);
}
.loc-stn-big-icon{
  width:28px;height:28px;border-radius:6px;
  background:transparent;color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.loc-stn-big-label{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:3px;letter-spacing:0.3px;}
.loc-stn-big-name{font-size:17px;font-weight:700;color:var(--text);}
.loc-stn-big-name.placeholder-name{font-size:14px;font-weight:400;color:var(--text3);}

/* ── FULL-PAGE STATION PICKER ── */
.stn-page{position:absolute;inset:0;background:white;z-index:210;display:none;flex-direction:column;}
.stn-page.open{display:flex;}

/* Top bar: blue header with back / title / confirm */
.stn-page-hdr{
  padding:calc(var(--safe-top) + 4px) 0 0;
  background:var(--accent);
  flex-shrink:0;
}
.stn-page-topbar{
  display:flex;align-items:center;height:54px;padding:0 4px;
}
.stn-page-back{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:white;flex-shrink:0;
}
.stn-page-title{
  flex:1;text-align:center;font-size:18px;font-weight:600;color:white;
}
.stn-page-actions{
  display:flex;align-items:center;padding-right:8px;
}
.stn-page-confirm{
  padding:6px 14px;font-size:16px;font-weight:600;color:white;
  cursor:pointer;background:none;border:none;font-family:inherit;
}

/* Selected station display row */
.stn-page-sel-row{
  display:flex;align-items:stretch;gap:0;padding:10px 14px 18px;
}
.stn-sel-wrap{flex:1;display:flex;flex-direction:column;}
.stn-sel-box{
  background:transparent !important;border-radius:8px;padding:9px 12px;
  min-height:48px;display:flex;align-items:center;justify-content:center;
  border:2.5px solid rgba(255,255,255,0.4);
  transition:all .15s;cursor:pointer;
}
.stn-sel-wrap.active .stn-sel-box{
  background:transparent !important;
  border:2.5px solid rgba(255,255,255,1);
  box-shadow:none;
}
.stn-sel-name{font-size:17px;font-weight:700;color:rgba(255,255,255,1);}
.stn-sel-placeholder{font-size:14px;color:rgba(255,255,255,0.4);}
.stn-sel-wrap.active .stn-sel-name{color:rgba(255,255,255,1);}
.stn-sel-wrap.active .stn-sel-placeholder{color:rgba(255,255,255,0.5);}
.stn-sel-label{
  font-size:12px;font-weight:600;text-align:center;margin-bottom:5px;
  letter-spacing:0.3px;color:rgba(255,255,255,0.4);transition:color .15s;
}
.stn-sel-wrap.active .stn-sel-label{color:rgba(255,255,255,1);}
.stn-swap-wrap{
  width:44px;display:flex;align-items:center;justify-content:center;
  padding-top:20px;
}
.stn-swap-icon{
  color:white;cursor:pointer;padding:6px;
  display:flex;align-items:center;justify-content:center;
  opacity:0.85;
}

/* Two-column body */
.stn-body{display:flex;flex:1;overflow:hidden;}

/* LEFT: county list ~40% width, light grey bg */
.stn-county-col{
  width:45.6%;background:#f5f5f5;border-right:1px solid #e0e0e0;
  overflow-y:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;
}
.stn-county-item{
  padding:13px 10px 13px 46px;font-size:17px;font-weight:400;color:#333;
  cursor:pointer;border-bottom:0.5px solid #e8e8e8;
  display:flex;align-items:center;justify-content:space-between;
  transition:background .1s;position:relative;
}
.stn-county-item:active{background:#eaeaea;}
.stn-county-item.sel{
  color:var(--accent);font-weight:700;background:#f5f5f5;
}
.stn-county-sep{
  padding:8px 16px 5px 46px;font-size:10px;font-weight:700;color:#aaa;
  letter-spacing:0.8px;text-transform:uppercase;background:#f5f5f5;
  border-bottom:0.5px solid #e8e8e8;
}
.stn-county-check{
  color:var(--accent);flex-shrink:0;
  display:flex;align-items:center;
}

/* RIGHT: station list */
.stn-list-col{
  flex:1;overflow-y:auto;background:white;
  -webkit-overflow-scrolling:touch;
}
.stn-list-item{
  padding:14px 18px 14px 30px;font-size:17px;font-weight:400;color:#666;
  border-bottom:0.5px solid #ebebeb;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  transition:background .1s;
}
.stn-list-item:active{background:#f5f5f5;}
.stn-list-item.sel{color:var(--accent);font-weight:700;}
.stn-list-item.major-stn{font-weight:700;color:#1a1a1a;}
.stn-list-check{color:var(--accent);display:flex;align-items:center;}
.stn-empty-col{
  padding:48px 16px;text-align:center;
  color:#aaa;font-size:16px;line-height:1.6;
}
.slider-wrap{padding:4px 0 12px;}
.slider-wrap input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:3px;background:var(--border2);outline:none;}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid white;box-shadow:0 1px 4px rgba(26,37,64,0.3);}
.slider-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:6px;}
.fld-lbl{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:0.3px;text-transform:uppercase;margin-bottom:7px;}

/* ── DETAIL PAGE ── */
.detail-page{position:absolute;inset:0;background:var(--bg);z-index:150;display:none;flex-direction:column;overflow:hidden;}
.detail-page.open{display:flex;}
.det-hdr{padding:calc(var(--safe-top) + 8px) 18px 13px;background:transparent;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0;}
.back-btn{display:flex;align-items:center;gap:4px;color:var(--accent);font-size:15px;font-weight:500;cursor:pointer;}
.det-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:20px 20px;}
.det-time{font-size:48px;font-weight:500;letter-spacing:-2px;color:var(--accent);line-height:1;}
.det-lbl{font-size:12px;color:var(--text3);margin-bottom:18px;margin-top:2px;}
.det-no{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:2px;}
.det-route{font-size:15px;color:var(--text2);margin-bottom:12px;}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.info-row:last-child{border-bottom:none;}
.ik{font-size:13px;color:var(--text3);}
.iv{font-size:13px;font-weight:600;color:var(--text);}
.stop-list{margin-top:6px;}
.stop-item{display:flex;align-items:flex-start;gap:14px;padding:11px 0;position:relative;}
.stop-item:not(:last-child)::after{content:'';position:absolute;left:7px;top:22px;width:2px;height:calc(100%);background:var(--border2);}
.stop-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);background:var(--bg);flex-shrink:0;z-index:1;margin-top:2px;}
.stop-dot.mj{border-color:var(--accent);background:var(--accent-lt);}
.sname{flex:1;font-size:17px;color:var(--text);}
.sname.mj{font-weight:700;}
.stime{font-size:16px;font-weight:500;color:var(--text2);}
.stop-item.cur-stop .sname{color:var(--accent);font-weight:700;}
.stop-item.cur-stop .stime{color:var(--accent);font-weight:700;}
.stop-item.cur-stop .stop-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(26,37,64,0.2);}
.slate{font-size:11px;color:var(--orange);margin-left:2px;}
.act-btns{display:flex;flex-direction:column;gap:8px;margin-top:20px;padding-bottom:20px;}
.btn-p{background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);padding:18px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;box-shadow:0 2px 8px rgba(26,37,64,0.25);}
.btn-s{background:white;color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;font-size:16px;font-weight:500;cursor:pointer;font-family:inherit;width:100%;}

/* ── TIMETABLE FORM ── */
.tt-form{background:white;border-radius:var(--radius);border:1px solid var(--border);padding:18px;margin-bottom:12px;box-shadow:var(--shadow);}
.tt-row{display:flex;align-items:flex-end;gap:7px;margin-bottom:14px;}
.tt-f{flex:1;min-width:0;}
.stn-display-btn{width:100%;padding:15px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);text-align:left;font-size:19px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:space-between;overflow:hidden;}
.stn-display-btn .placeholder{color:var(--text3);font-weight:400;}
.swap-btn{width:42px;height:52px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent);flex-shrink:0;}
.tt-date{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:15px 10px;color:var(--text);font-family:inherit;font-size:18px;font-weight:700;width:100%;outline:none;overflow:hidden;-webkit-appearance:none;min-width:0;}
.tt-now-btn{display:flex;align-items:center;gap:5px;padding:0 14px;background:var(--accent-lt);border:1.5px solid var(--accent);border-radius:var(--radius-sm);color:var(--accent);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.tt-now-btn.active{background:var(--accent);color:white;}
.srch-btn{background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);padding:18px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;margin-top:4px;box-shadow:0 2px 8px rgba(26,37,64,0.2);}

/* ── TT CARD ── */
.tt-card{background:white;border-radius:var(--radius);border:1px solid var(--border);padding:13px 15px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .15s;}
.tt-card:active{background:var(--bg);}
.tt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.tt-times{font-size:26px;font-weight:800;letter-spacing:-0.5px;color:var(--text);}
.tt-dur{font-size:12px;color:var(--text3);}
.tt-mid{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.tt-route{font-size:13px;color:var(--text2);font-weight:600;}

/* ── FAVS ── */
.fav-card{background:white;border-radius:var(--radius);border:1px solid var(--border);padding:15px;margin-bottom:10px;box-shadow:var(--shadow);}
.fav-name{font-size:16px;font-weight:700;color:var(--text);margin-bottom:3px;}
.fav-meta{font-size:12px;color:var(--text3);margin-bottom:9px;}
.fav-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px;}
.fav-tag{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-size:11px;color:var(--text2);}
.fav-go{background:var(--accent-lt);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:9px;text-align:center;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;}

/* ── SETTINGS ── */
.sg{background:white;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);}
.si{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--border);}
.si:last-child{border-bottom:none;}
.si-left{display:flex;align-items:center;gap:10px;}
.si-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.sk{font-size:15px;color:var(--text);}
.sv{font-size:13px;color:var(--text3);}
.sv.ok{color:var(--green);font-weight:500;}

/* ── BELL CENTER ── */
.bell-sec{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.5px;text-transform:uppercase;margin:14px 0 6px;}
.bell-item{background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);padding:12px 13px;margin-bottom:6px;}
.bell-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.bdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.bdot.w{background:var(--accent);}
.bdot.n{background:var(--green);}
.bdot.e{background:var(--text3);}
.btrain{font-size:14px;font-weight:600;flex:1;color:var(--text);}
.bstat{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:500;}
.bstat.w{background:var(--accent-lt);color:var(--accent);}
.bstat.n{background:var(--green-lt);color:var(--green);}
.bstat.e{background:var(--bg3);color:var(--text3);}
.binfo{font-size:12px;color:var(--text3);}

/* ── ALERT ── */
.alert-ov{position:absolute;inset:0;background:rgba(20,40,90,0.4);z-index:300;display:none;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(4px);}
.alert-ov.open{display:flex;}
.alert-box{background:white;border-radius:20px;width:100%;padding:26px 20px;box-shadow:0 8px 32px rgba(26,64,128,0.18);}
.al-icon{width:56px;height:56px;border-radius:50%;background:var(--accent-lt);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.al-title{font-size:19px;font-weight:700;text-align:center;margin-bottom:5px;color:var(--text);}
.al-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:22px;white-space:pre-line;}
.al-btns{display:flex;flex-direction:column;gap:8px;}

.empty-state{text-align:center;padding:48px 20px;color:var(--text3);}
.empty-icon{display:flex;justify-content:center;margin-bottom:12px;}
.empty-text{font-size:15px;}

.tt-card-nearest{border-color:var(--accent);border-width:1.5px;}
.tt-nearest-tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:white;font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px;margin-bottom:8px;}
/* ── FAV SUB-TABS ── */
.fav-subtabs{display:flex;gap:0;background:#C8C8CE;border-radius:10px;padding:3px;margin-bottom:14px;}
.fav-subtab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:500;font-family:inherit;border:none;background:transparent;color:var(--text3);cursor:pointer;transition:all .15s;}
.fav-subtab.active{background:white;color:var(--accent);font-weight:600;box-shadow:var(--shadow);}

/* ── TT CARD HEART ── */
.tt-card{position:relative;}
.tt-heart-btn{position:absolute;top:11px;right:11px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:var(--text3);transition:color .15s,transform .15s;z-index:2;}
.tt-heart-btn:active{transform:scale(0.82);}
.tt-heart-btn.liked{color:var(--red);}
.tt-fav-card{background:white;border-radius:var(--radius);border:1px solid var(--border);padding:13px 15px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;}
.tt-fav-body{flex:1;min-width:0;}
.tt-fav-times{font-size:18px;font-weight:800;letter-spacing:-0.5px;color:var(--text);margin-bottom:5px;}
.tt-fav-mid{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.tt-fav-route{font-size:13px;color:var(--text2);}
.tt-fav-del{width:34px;height:34px;border-radius:50%;background:var(--red-lt);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}

/* ── ANIMATIONS ── */
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.sheet-ov.open .sheet{animation:slideUp .3s cubic-bezier(.32,.72,0,1)}
.detail-page.open{animation:fadeIn .2s ease}
.alert-ov.open .alert-box{animation:scaleIn .22s cubic-bezier(.32,.72,0,1)}
</style>
</head>
<body>
<div id="app">

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="logo-text">Railshot</div>
  </div>
</div>

<!-- TAB 1: 時刻表 (FIRST) -->
<div class="screen active" id="tab-tt">
<div class="sc">
  <div class="tt-form">
    <div class="tt-row">
      <div class="tt-f">
        <div class="fld-lbl">出發站</div>
        <button class="stn-display-btn" onclick="openStnPicker('tt-from')">
          <span id="tt-from-lbl" class="placeholder">選擇車站</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M7 10l5 5 5-5z" fill="#8a9db8"/></svg>
        </button>
      </div>
      <div class="swap-btn" onclick="swapTT()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z" fill="#1a2540"/></svg>
      </div>
      <div class="tt-f">
        <div class="fld-lbl">到達站</div>
        <button class="stn-display-btn" onclick="openStnPicker('tt-to')">
          <span id="tt-to-lbl" class="placeholder">選擇車站</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M7 10l5 5 5-5z" fill="#8a9db8"/></svg>
        </button>
      </div>
    </div>
    <div style="margin-bottom:14px;">
      <div class="fld-lbl">日期 / 時刻</div>
      <div style="display:flex;gap:7px;align-items:stretch;">
        <input type="date" class="tt-date" id="tt-date" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;"/>
        <button class="tt-now-btn" onclick="setNowTime()" id="tt-now-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z" fill="currentColor"/></svg>
          現在時刻
        </button>
      </div>
    </div>
    <div class="chips-row" id="tt-type-chips" style="margin-bottom:11px;">
      <div class="chip on" data-val="all" onclick="ttChipToggle(this,'all')">全部</div>
      <div class="chip" data-val="exp3" onclick="ttChipToggle(this,'exp3')">自強3000</div>
      <div class="chip" data-val="puy" onclick="ttChipToggle(this,'puy')">普悠瑪</div>
      <div class="chip" data-val="exp" onclick="ttChipToggle(this,'exp')">自強</div>
      <div class="chip" data-val="moc" onclick="ttChipToggle(this,'moc')">莒光</div>
      <div class="chip" data-val="localx" onclick="ttChipToggle(this,'localx')">區間快</div>
      <div class="chip" data-val="local" onclick="ttChipToggle(this,'local')">區間</div>
      <div class="chip" data-val="tze" onclick="ttChipToggle(this,'tze')">太魯閣</div>
    </div>
    <button class="srch-btn" onclick="searchTT()">查詢班次</button>
  </div>
  <div id="tt-results-header" style="display:none;justify-content:flex-end;padding:4px 0 2px;">
    <button onclick="clearTTResults()" style="background:none;border:none;cursor:pointer;color:var(--text3);display:flex;align-items:center;gap:4px;font-size:13px;font-family:inherit;padding:4px 0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/></svg>
      重新查詢
    </button>
  </div>
  <div id="tt-results"></div>
</div>
</div>

<!-- TAB 2: 拍車 (SECOND) -->
<div class="screen" id="tab-shoot">
<div class="sc">
  <div class="sec">拍攝點</div>
  <div class="loc-bar" onclick="openSheet('loc-sheet')">
    <div>
      <div class="loc-name" id="loc-display">點此設定拍攝點</div>
      <div class="loc-mode" id="loc-mode-display"></div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="#8a9db8"/></svg>
  </div>

  <div style="display:flex;align-items:flex-start;margin-bottom:12px;">
    <div>
      <div class="sec" style="margin:0 0 8px;">時間範圍</div>
      <div id="time-chips" style="display:flex;gap:8px;">
        <div class="chip-round on" data-val="60" onclick="setChip(this,'time-chips');filterTrains()"><div>1</div><div>hr</div></div>
        <div class="chip-round" data-val="120" onclick="setChip(this,'time-chips');filterTrains()"><div>2</div><div>hr</div></div>
        <div class="chip-round" data-val="180" onclick="setChip(this,'time-chips');filterTrains()"><div>3</div><div>hr</div></div>
      </div>
    </div>
    <div style="width:1px;height:80px;background:var(--border);margin:0 16px;flex-shrink:0;align-self:flex-end;"></div>
    <div>
      <div class="sec" style="margin:0 0 8px;">方向</div>
      <div id="dir-chips" style="display:flex;gap:8px;">
        <div class="chip-round on" data-val="all" onclick="setChip(this,'dir-chips');filterTrains()"><div>全部</div></div>
        <div class="chip-round" data-val="up" onclick="setChip(this,'dir-chips');filterTrains()"><div>上行</div></div>
        <div class="chip-round" data-val="down" onclick="setChip(this,'dir-chips');filterTrains()"><div>下行</div></div>
      </div>
    </div>
  </div>

  <div class="sec" style="margin-top:4px;">車種</div>
  <div class="chips-row" id="type-chips">
    <div class="chip on" data-val="all" onclick="shootChipToggle(this,'all')">全部</div>
    <div class="chip" data-val="exp3" onclick="shootChipToggle(this,'exp3')">自強3000</div>
    <div class="chip" data-val="puy" onclick="shootChipToggle(this,'puy')">普悠瑪</div>
    <div class="chip" data-val="exp" onclick="shootChipToggle(this,'exp')">自強</div>
    <div class="chip" data-val="moc" onclick="shootChipToggle(this,'moc')">莒光</div>
    <div class="chip" data-val="localx" onclick="shootChipToggle(this,'localx')">區間快</div>
    <div class="chip" data-val="local" onclick="shootChipToggle(this,'local')">區間</div>
    <div class="chip" data-val="tze" onclick="shootChipToggle(this,'tze')">太魯閣</div>

  <div style="margin-top:14px;">

        查詢列車
      </span>
    </button>
  </div>

  <div id="shoot-results" style="margin-top:16px;display:none;">
    <div class="rh">
      <div class="rt" id="res-loc"></div>
      <div class="rc" id="res-count"></div>
    </div>
    <div id="train-list"></div>
  </div>
</div>
</div>

<div class="sc">

  const chips = document.querySelectorAll('#tt-type-chips .chip');

  if(val === 'all'){
    // 點「全部」→ 清除其他，只選全部

  active: 'from',   // which slot is being edited
  from: '',
  to: '',

function openStnPage(caller, initialFrom, initialTo, activeSlot, cb){
  spState.caller = caller;
  spState.from = initialFrom || '';
  spState.to = initialTo || '';
  spState.active = activeSlot || 'from';
  spState.callerCb = cb || null;

  // 單框 vs 雙框模式
  // loc-b1（兩站之間選第一站）用單框，只選一站，選完後自動顯示相鄰區間
  const isSingle = caller === 'loc-single' || caller === 'loc-b2' || caller === 'loc-b1';
  const isBetween = false; // loc-b1 現在用單框
  document.getElementById('sp-single-mode').style.display = isSingle ? 'block' : 'none';
  document.getElementById('sp-double-mode').style.display = isSingle ? 'none' : 'flex';

  // 標籤
  const fromLabel = document.getElementById('sp-from-label');
  const toLabel = document.getElementById('sp-to-label');
  const swapWrap = document.getElementById('sp-swap-wrap');
  if(fromLabel) fromLabel.textContent = '出發';
  if(toLabel) toLabel.textContent = '抵達';
  if(swapWrap) swapWrap.style.display = 'flex';

  // 帶入當下選取站的縣市
  const curStn = spState.active === 'from' ? spState.from : spState.to;
  spState.county = curStn ? spFindCountyOfStation(curStn) : '';

  spRenderHeader();
  spRenderCountyCol();
  spRenderStnCol();

  // 若有縣市，滾到選中的縣市
  if(spState.county) {
    setTimeout(() => {
      const items = document.querySelectorAll('.stn-county-item');
      items.forEach(el => {
        if(el.textContent.trim().startsWith(spState.county)) {
          el.scrollIntoView({block:'center',behavior:'smooth'});
        }
      });
    }, 100);
  }

  document.getElementById('stn-page').classList.add('open');
}

function spFindCountyOfStation(stnName){
  const alts = [stnName, stnName.replace(/台/g,'臺'), stnName.replace(/臺/g,'台')];
  for(const name of alts){
    for(const county of COUNTY_LIST){
      if(STN_DATA[county].includes(name)) return county;
    }
    for(const br of BRANCH_COUNTIES){
      if(BRANCH_LINES[br].includes(name)) return br;
    }
  }
  return '';
}
function closeStnPage(){
  document.getElementById('stn-page').classList.remove('open');
}
function confirmStnPage(){
  if(spState.callerCb) spState.callerCb(spState.from, spState.to);
  closeStnPage();
}
function spSetActive(slot){
  spState.active = slot;
  // 切換時帶入對應站的縣市
  const curStn = slot === 'from' ? spState.from : spState.to;
  spState.county = curStn ? spFindCountyOfStation(curStn) : '';
  spRenderHeader();
  spRenderCountyCol();
  spRenderStnCol();
  // 滾到選中的縣市
  if(spState.county){
    setTimeout(()=>{
      const items = document.querySelectorAll('.stn-county-item');
      items.forEach(el=>{
        if(el.textContent.trim().startsWith(spState.county))
          el.scrollIntoView({block:'center',behavior:'smooth'});
      });

  }
}
function spSwap(){
  const tmp = spState.from;
  spState.from = spState.to;

}
function spRenderHeader(){
  const fromEl = document.getElementById('sp-from-inner');
  const toEl = document.getElementById('sp-to-inner');
  const fromWrap = document.getElementById('sp-from-wrap');
  const toWrap = document.getElementById('sp-to-wrap');
  const singleInner = document.getElementById('sp-single-inner');

  // 單框模式 — 顯示當前 active slot 的站名
  if(singleInner){
    const curStn = spState.active === 'from' ? spState.from : spState.to;
    singleInner.innerHTML = curStn
      ? `<span class="stn-sel-name">${curStn}</span>`
      : `<span class="stn-sel-placeholder">請選擇車站</span>`;
  }

  if(fromEl) fromEl.innerHTML = spState.from
    ? `<span class="stn-sel-name">${spState.from}</span>`
    : `<span class="stn-sel-placeholder">請選擇</span>`;
  if(toEl) toEl.innerHTML = spState.to
    ? `<span class="stn-sel-name">${spState.to}</span>`
    : `<span class="stn-sel-placeholder">請選擇</span>`;

  if(fromWrap) fromWrap.classList.toggle('active', spState.active === 'from');
  if(toWrap)   toWrap.classList.toggle('active', spState.active === 'to');
}
const CHECKSVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="currentColor"/></svg>`;
function spRenderCountyCol(){
  const el = document.getElementById('sp-county-col');
  const curSel = spState.active === 'from' ? spState.from : spState.to;
  let html = '';
  COUNTY_LIST.forEach(county => {
    const isSel = spState.county === county;
    const stns = spGetStationsForCounty(county);
    const hasSelected = curSel && stns.includes(curSel);
    html += `<div class="stn-county-item${isSel?' sel':''}" onclick="spSelectCounty('${county}')">
      <span>${county}</span>
      ${(isSel || hasSelected) ? `<span class="stn-county-check">${CHECKSVG}</span>` : ''}
    </div>`;
  });
  html += `<div class="stn-county-sep">支線</div>`;
  BRANCH_COUNTIES.forEach(name => {
    const isSel = spState.county === name;
    const stns = spGetStationsForCounty(name);
    const hasSelected = curSel && stns.includes(curSel);
    html += `<div class="stn-county-item${isSel?' sel':''}" onclick="spSelectCounty('${name}')">
      <span>${name}</span>
      ${(isSel || hasSelected) ? `<span class="stn-county-check">${CHECKSVG}</span>` : ''}
    </div>`;
  });
  el.innerHTML = html;
}
function spSelectCounty(county){
  spState.county = county;
  spRenderCountyCol();
  spRenderStnCol();
  // Scroll station list back to top
  const sc = document.getElementById('sp-stn-col');
  if(sc) sc.scrollTop = 0;
}
function spGetStationsForCounty(county){
  if(STN_DATA[county]) return STN_DATA[county];
  if(BRANCH_LINES[county]) return BRANCH_LINES[county];
  return [];
}
function spRenderStnCol(){
  const el = document.getElementById('sp-stn-col');
  if(!spState.county){
    el.innerHTML = `<div class="stn-empty-col">← 請先從左側選擇縣市</div>`;
    return;
  }
  const stns = spGetStationsForCounty(spState.county);
  const fromSel = spState.from;
  const toSel = spState.to;
  const curSel = spState.active === 'from' ? fromSel : toSel;
  el.innerHTML = stns.map(s => {
    const isCurSel = curSel === s;
    // Also show if it's the other slot's selection (different color hint)
    const isOtherSel = spState.active === 'from' ? toSel === s : fromSel === s;
    const isMaj = MAJOR.has(s);
    let cls = 'stn-list-item';
    if(isCurSel) cls += ' sel';
    if(isMaj) cls += ' major-stn';
    return `<div class="${cls}" onclick="spSelectStation('${s}')">
      <span>${s}</span>
      ${isCurSel ? `<span class="stn-list-check">${CHECKSVG}</span>` : ''}
    </div>`;
  }).join('');
}
function spSelectStation(s){
  const wasFrom = spState.active === 'from';
  if(wasFrom) spState.from = s;
  else spState.to = s;

  // 拍攝點模式
  if(spState.caller && spState.caller.startsWith('loc-')){
    if(spState.caller === 'loc-single'){
      // 單站：選完停留在選站頁，更新 header 顯示，等按確定
      spRenderHeader();
      spRenderStnCol(); // 更新勾選狀態
    } else if(spState.caller === 'loc-b2'){
      // 單框（b2）：選完直接關閉
      spRenderHeader();
      setTimeout(() => {
        if(spState.callerCb) spState.callerCb(spState.from, spState.to);
        closeStnPage();
      }, 200);
    } else if(spState.caller === 'loc-b1'){
      // 兩站之間第一站：選完停留，更新顯示，等按確定
      spRenderHeader();
      spRenderStnCol(); // 更新右側勾選狀態
    } else {
      // 兩站之間：選完第二站 → 更新畫面，等按確定
      spRenderHeader();
      spRenderCountyCol();
      spRenderStnCol();
      if(spState.callerCb) spState.callerCb(spState.from, spState.to);
    }
    return;
  }

  if(wasFrom){
    // 選完出發站 → 自動切換到抵達站，清空縣市讓使用者重選
    spState.active = 'to';
    spState.county = '';
    spRenderHeader();
    spRenderCountyCol();
    spRenderStnCol();
    const col = document.getElementById('sp-county-col');
    if(col) col.scrollTop = 0;
    // 立即把出發站回傳給 callback
    if(spState.callerCb) spState.callerCb(spState.from, spState.to);
  } else {
    // 選完抵達站 → 只更新畫面，等使用者按確定
    spRenderHeader();
    spRenderCountyCol();
    spRenderStnCol();
    if(spState.callerCb) spState.callerCb(spState.from, spState.to);
  }
}

    ['中洲','長榮大學','沙崙'],
  ];
  for (const route of routes) {
    const idx = route.indexOf(stnName);
    if (idx < 0) {
      const alt = stnName.replace(/台/g,'臺').replace(/臺/g,'台');

      if (idx2 < 0) continue;
      return { prev: idx2 > 0 ? route[idx2-1] : null, next: idx2 < route.length-1 ? route[idx2+1] : null };

function distKm(lat1,lng1,lat2,lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function findNearestStations(lat, lng, n=3){
  return STN_COORDS
    .map(s=>({...s, dist:distKm(lat,lng,s.lat,s.lng)}))
    .sort((a,b)=>a.dist-b.dist)
    .slice(0,n);
}

function buildFrontendIndex(trains) {
  gttStationIdx = {};
  // 預先按首站發車時間排序，讓查詢時能更快掃描
  trains.sort((a, b) => {
    const ta = a.stops[0]?.dep || a.stops[0]?.arr || '99:99';
    const tb = b.stops[0]?.dep || b.stops[0]?.arr || '99:99';
    return ta.localeCompare(tb);
  });
  for (const train of trains) {
    train.stopSet = new Set(train.stops.map(s => s.stn).filter(Boolean));
    // 預先計算首末停靠站的分鐘數，供查詢快速剔除
    const firstStop = train.stops[0];
    const lastStop  = train.stops[train.stops.length - 1];
    train._startMins = toMins(firstStop?.dep || firstStop?.arr || '');
    train._endMins   = toMins(lastStop?.arr  || lastStop?.dep  || '');
    for (const stop of train.stops) {
      if (!stop.stn) continue;
      if (!gttStationIdx[stop.stn]) gttStationIdx[stop.stn] = [];
      gttStationIdx[stop.stn].push(train);
    }
  }
}

async function ensureGTT() {
  if (gttData && gttStationIdx) return gttData;
  const key = gttCacheKey();
  try {
    for (const k of Object.keys(localStorage)) {
      if (k.startsWith('railshot_gtt_') && k !== key) localStorage.removeItem(k);
    }
  } catch(e) {}
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const parsed = JSON.parse(raw);
      const today = new Date().toISOString().split('T')[0];
      // 日期一致 且 TTL 未過期 才使用 cache
      if (parsed.date === today && Date.now() - parsed.builtAt < GTT_TTL) {
        gttData = parsed;
        buildFrontendIndex(gttData.trains);
        console.log(`GTT loaded from cache [${parsed.source}]: ${gttData.trains.length} trains`);
        return gttData;
      } else {
        localStorage.removeItem(key); // 日期不符或過期，主動清除
      }
    }
  } catch(e) {}

  if (!API_BASE) return null;

  document.getElementById('train-list').innerHTML =
    `<div style="text-align:center;padding:2rem 0;color:var(--text3);">
      <svg width="40" height="40" viewBox="0 0 40 40" style="animation:spin 1s linear infinite;margin-bottom:8px;" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="16" fill="none" stroke="#e0e0e0" stroke-width="4"/>
        <circle cx="20" cy="20" r="16" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="60 44" stroke-linecap="round"/>
      </svg>
      <div style="font-size:14px;">載入當日時刻資料中...<br><span style="font-size:12px;color:var(--text3);">首次需要約 10 秒</span></div>
    </div>`;

  const resp = await fetch(`${API_BASE}/api/timetable`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  gttData = await resp.json();
  buildFrontendIndex(gttData.trains);
  try { localStorage.setItem(key, JSON.stringify(gttData)); } catch(e) {}
  console.log(`GTT fetched [${gttData.source}]: ${gttData.trains.length} trains`);
  return gttData;
}

}

// 計算顯示用上下行（不依賴 TDX Direction）
function calculateDisplayDir(train) {
  const from = train.from || '';
  const to   = train.to   || '';
  const fi = STATION_ORDER[from];
  const ti = STATION_ORDER[to];
  if (fi !== undefined && ti !== undefined) {
    return fi < ti ? 'down' : 'up'; // index 小=北，大=南；fi<ti = 北→南 = 下行
  }
  // fallback: 用 stops 第一站和最後一站
  const stops = train.stops || [];
  if (stops.length >= 2) {
    const si = STATION_ORDER[stops[0].stn];
    const ei = STATION_ORDER[stops[stops.length-1].stn];
    if (si !== undefined && ei !== undefined) return si < ei ? 'down' : 'up';
  }
  return train.dir; // 最終 fallback 才用 TDX
}

// Debug 工具
// 從起終站名計算方向（供 TT detail 使用）
function calcDirFromFromTo(from, to, fallback) {
  const norm = s => {
    if (!s) return undefined;
    return STATION_ORDER[s] ?? STATION_ORDER[s.replace(/臺/g,'台')] ?? STATION_ORDER[s.replace(/台/g,'臺')];
  };
  const fi = norm(from), ti = norm(to);
  if (fi !== undefined && ti !== undefined) return fi < ti ? 'down' : 'up';
  return fallback || 'down';
}

const PASS_THRU_TYPES = new Set(['exp','exp3','puy','tze','moc']);

// ── 里程插值估算列車通過目標站的時間 ─────────────────
function estimatePassTime(train, targetName) {
  const targetKm = stnKm(targetName);
  if (targetKm === undefined) return null;

  const altTarget = targetName.replace(/台/g,'臺').replace(/臺/g,'台');
  const targetRoutes = stationRoutes(targetName).length > 0
    ? stationRoutes(targetName)
    : stationRoutes(altTarget);
  const stops = train.stops;
  const altName = targetName.replace(/台/g,'臺').replace(/臺/g,'台');

  // 先看是否直接停靠
  const direct = stops.find(s => s.stn === targetName || s.stn === altName);
  if (direct) {
    return { time: direct.dep || direct.arr, isEst: false };
  }

  // 非停靠 → 只有允許通過估算的車種才繼續
  if (!PASS_THRU_TYPES.has(train.type)) return null;

  // 依停靠站序找相鄰站對，驗證同路線且 targetKm 落在其里程之間
  for (let i = 0; i < stops.length - 1; i++) {
    const sA = stops[i].stn;
    const sB = stops[i + 1].stn;
    const aKm = stnKm(sA);
    const bKm = stnKm(sB);
    if (aKm === undefined || bKm === undefined) continue;

  // ── 路線驗證：前後站與目標站至少有一條共同路線 ──────
  if (targetRoutes.length > 0) {
    const aRoutes = stationRoutes(sA);
    const bRoutes = stationRoutes(sB);
    // 前後站都必須與目標站有共同路線
    const aMatch = aRoutes.length === 0 || aRoutes.some(r => targetRoutes.includes(r));
    const bMatch = bRoutes.length === 0 || bRoutes.some(r => targetRoutes.includes(r));
    if (!aMatch || !bMatch) continue;
  }

    const tA = stops[i].dep || stops[i].arr;
    const tB = stops[i + 1].arr || stops[i + 1].dep;
    if (!tA || !tB) continue;

    const lo = Math.min(aKm, bKm);
    const hi = Math.max(aKm, bKm);
    if (targetKm > lo && targetKm < hi) {
      const mA = toMins(tA);
      const mB = toMins(tB);
      if (mA < 0 || mB < 0) continue;
      const ratio = Math.abs(targetKm - aKm) / Math.abs(bKm - aKm);
      const estMins = Math.round(mA + ratio * (mB - mA));
      const h = Math.floor(estMins / 60) % 24;
      const m = estMins % 60;
      const estTime = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      return {
        time: estTime, isEst: true,
        debug: {
          prev: sA, prevKm: aKm, prevTime: tA,
          next: sB, nextKm: bKm, nextTime: tB,
          ratio: Math.round(ratio * 100) / 100,
        }
      };
    }
  }
  return null;
}

// ── 前端查詢核心 ──────────────────────────────────────
function toMins(t) {
  if (!t || t === '??:??') return -1;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

// 單站查詢：停靠 + 通過估算（區間/區間快無停靠直接排除）
function queryStation(stnName, nowMins, endMins, dirFilter, typeFilter) {
  if (!gttData) return [];
  const results = [];
  const seen = new Set();

  for (const train of gttData.trains) {
    if (dirFilter !== 'all' && train.dir !== dirFilter) continue;
    if (typeFilter !== 'all' && !typeFilter.includes(train.type)) continue;

    // 快速過濾：列車行駛時間完全不涵蓋查詢窗口
    if (train._endMins >= 0 && train._endMins < nowMins) continue;
    if (train._startMins >= 0 && train._startMins > endMins + 60) continue;

    const result = estimatePassTime(train, stnName);
    if (!result) continue;

    // console log for pass-through estimates
    if (result.isEst && result.debug) {
      const d = result.debug;
      console.log(
        `○ 通過估算 TrainNo:${train.no} Type:${train.type} Source:${gttData.source}\n` +
        `  Target:${stnName} Est:${result.time}\n` +
        `  Prev:${d.prev}(${d.prevKm}km) ${d.prevTime} → Next:${d.next}(${d.nextKm}km) ${d.nextTime} ratio:${d.ratio}`
      );
    }

    const m = toMins(result.time);
    if (m < nowMins || m > endMins) continue;
    if (seen.has(train.no)) continue;
    seen.add(train.no);
    results.push({ train, passTime: result.time, passMins: m, isEst: result.isEst });
  }
  results.sort((a, b) => a.passMins - b.passMins);
  return results;
}

// ── Debug 工具：比對台鐵官方資料用 ───────────────────
window.debugStationPass = function(stnName, startTime, endTime) {
  if (!gttData) { console.log('gttData not loaded'); return; }
  const startMins = toMins(startTime);
  const endMins   = toMins(endTime);
  const stopped = [], passed = [], excluded = [];

  for (const train of gttData.trains) {
    const altName = stnName.replace(/台/g,'臺').replace(/臺/g,'台');
    const direct = train.stops.find(s => s.stn === stnName || s.stn === altName);

    if (direct) {
      const t = direct.dep || direct.arr;
      const m = toMins(t);
      if (m >= startMins && m <= endMins)
        stopped.push({ no: train.no, type: train.type, time: t, from: train.from, to: train.to });
      continue;
    }

    // 非停靠 → 嘗試通過估算
    if (!PASS_THRU_TYPES.has(train.type)) {
      // 確認是否本來有機會通過（前後站夾住）但被排除
      const targetKm = stnKm(stnName);
      if (targetKm !== undefined) {
        for (let i = 0; i < train.stops.length - 1; i++) {
          const aKm = stnKm(train.stops[i].stn);
          const bKm = stnKm(train.stops[i+1].stn);
          if (aKm === undefined || bKm === undefined) continue;
          const lo = Math.min(aKm, bKm), hi = Math.max(aKm, bKm);
          if (targetKm > lo && targetKm < hi) {
            excluded.push({ no: train.no, type: train.type, reason: `${train.type} 不允許通過估算`, from: train.from, to: train.to });
            break;
          }
        }
      }
      continue;
    }

    const result = estimatePassTime(train, stnName);
    if (!result) {
      excluded.push({ no: train.no, type: train.type, reason: '無法找到前後站或里程不足', from: train.from, to: train.to });
      continue;
    }
    const m = toMins(result.time);
    if (m < startMins || m > endMins) {
      excluded.push({ no: train.no, type: train.type, reason: `時間 ${result.time} 不在範圍內`, from: train.from, to: train.to });
      continue;
    }
    const d = result.debug || {};
    passed.push({
      no: train.no, type: train.type, estTime: result.time,
      prev: d.prev, prevTime: d.prevTime, prevKm: d.prevKm,
      next: d.next, nextTime: d.nextTime, nextKm: d.nextKm,
      ratio: d.ratio, from: train.from, to: train.to,
    });
  }

  stopped.sort((a,b) => a.time.localeCompare(b.time));
  passed.sort((a,b) => a.estTime.localeCompare(b.estTime));

  console.log(`=== debugStationPass("${stnName}", "${startTime}", "${endTime}") ===`);
  console.log(`資料來源: ${gttData.source}  日期: ${gttData.date}`);
  console.log(`\n● 停靠 (${stopped.length}班)`);
  stopped.forEach(t => console.log(`  ${t.time} ${t.type} ${t.no}  ${t.from}→${t.to}`));
  console.log(`\n○ 通過估算 (${passed.length}班)`);
  passed.forEach(t => console.log(`  ${t.estTime} ${t.type} ${t.no}  ${t.from}→${t.to}\n    Prev:${t.prev}(${t.prevKm}km)${t.prevTime} → Next:${t.next}(${t.nextKm}km)${t.nextTime} ratio:${t.ratio}`));
  console.log(`\n✗ 排除 (${excluded.length}班)`);
  excluded.forEach(t => console.log(`  ${t.type} ${t.no}  ${t.from}→${t.to}  原因:${t.reason}`));
  console.log(`\n=== 合計 停靠${stopped.length} 通過${passed.length} 排除${excluded.length} ===`);
  return { stopped, passed, excluded, source: gttData.source, date: gttData.date };
};

function queryBetween(s1Name, s2Name, nowMins, endMins, dirFilter, typeFilter) {
  if (!gttData) return [];
  const results = [];
  const seen = new Set();

  for (const train of gttData.trains) {
    if (typeFilter !== 'all' && !typeFilter.includes(train.type)) continue;

    // 快速過濾：列車行駛時間完全不涵蓋查詢窗口
    if (train._endMins >= 0 && train._endMins < nowMins) continue;
    if (train._startMins >= 0 && train._startMins > endMins + 60) continue;

    // 用里程估算取 s1 和 s2 的通過時間（含直接停靠）
    const r1 = estimatePassTime(train, s1Name);
    const r2 = estimatePassTime(train, s2Name);
    if (!r1 || !r2) continue;

    const m1 = toMins(r1.time);
    const m2 = toMins(r2.time);
    if (m1 < 0 || m2 < 0 || m1 === m2) continue;

    // 方向判斷：用兩站的估算時間先後決定列車行進方向
    const goingDown = m2 > m1; // s2 比 s1 晚 → 下行方向
    if (dirFilter === 'down' && !goingDown) continue;
    if (dirFilter === 'up'   &&  goingDown) continue;

    // 時間篩選：s1 通過時間在範圍內
    if (m1 < nowMins || m1 > endMins) continue;
    if (seen.has(train.no)) continue;
    seen.add(train.no);

    results.push({
      train, s1Time: r1.time, s2Time: r2.time, s1Mins: m1,
      s1Est: r1.isEst, s2Est: r2.isEst,
    });
  }
  results.sort((a, b) => a.s1Mins - b.s1Mins);
  return results;
}

// ── 主查詢函式 ────────────────────────────────────────
async function doSearch() {
  const dirEl  = document.querySelector('#dir-chips .chip.on, #dir-chips .chip-round.on');
  const timeEl = document.querySelector('#time-chips .chip.on, #time-chips .chip-round.on');
  const dv  = dirEl?.dataset.val || 'all';
  const tv  = getShootSelectedTypes();
  const loc = document.getElementById('loc-display').textContent.trim();
  const locMode = document.getElementById('loc-mode-display').textContent;

  document.getElementById('res-loc').textContent = loc;
  document.getElementById('shoot-results').style.display = 'block';

  const timeRange = parseInt(timeEl?.dataset.val || '60');
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const endMins = nowMins + timeRange;

  const isBetween = locMode === '兩站之間' || loc.includes('－') || loc.includes('間');
  const isEmpty = !loc || loc === '點此設定拍攝點';

  if (isEmpty) {
    document.getElementById('train-list').innerHTML =
      `<div class="empty-state"><div class="empty-text">請先選擇拍攝點</div></div>`;
    return;
  }

  // 有 API_BASE → 用真實資料
  if (API_BASE) {
    document.getElementById('train-list').innerHTML =
      `<div style="text-align:center;padding:2rem 0;color:var(--text3);">
        <svg width="36" height="36" viewBox="0 0 40 40" style="animation:spin 1s linear infinite;margin-bottom:8px;" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="16" fill="none" stroke="#e0e0e0" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="60 44" stroke-linecap="round"/></svg>查詢中...
      </div>`;
    try {
      await ensureGTT();
    } catch(e) {
      document.getElementById('train-list').innerHTML =
        `<div style="background:var(--red-lt);border:1px solid #ffcccc;border-radius:var(--radius-sm);padding:14px;color:var(--red);font-size:14px;">
          ⚠️ 載入失敗：${e.message}
        </div>`;
      return;
    }

    // 取即時誤點
    let liveMap = {};
    try {
      const lr = await fetch(`${API_BASE}/api/live`);
      const ld = await lr.json();
      (ld.TrainLiveBoards || []).forEach(t => { liveMap[t.TrainNo] = t.DelayTime || 0; });
    } catch(e) {}

    if (isBetween) {
      const parts = loc.replace(/間$/, '').split('－');
      const s1 = parts[0]?.trim() || '';
      const s2 = parts[1]?.trim() || '';
      const results = queryBetween(s1, s2, nowMins, endMins, dv, tv);
      document.getElementById('res-count').textContent = results.length + ' 班';
      renderBetweenResults(results, s1, s2, liveMap);
    } else {
      const stn = loc.replace(/站$/, '').trim();
      const results = queryStation(stn, nowMins, endMins, dv, tv);
      document.getElementById('res-count').textContent = results.length + ' 班';
      renderStationResults(results, stn, liveMap);
    }
    return;
  }

  // 假資料模式
  const list = TRAINS
    .filter(t => (dv === 'all' || t.dir === dv) && (tv === 'all' || Array.isArray(tv) && tv.includes(t.type)))
    .sort((a, b) => a.passTime.localeCompare(b.passTime));
  document.getElementById('res-count').textContent = list.length + ' 班';
  renderTrainList(list);
}

function filterTrains() {
  if (document.getElementById('shoot-results').style.display === 'none') return;
  doSearch();
}

// ===== DETAIL =====
async function openDetailByNo(trainNo, atStation, s2Station, s1TimeOverride, s2TimeOverride) {
  const isBetween = !!s2Station;
  const detPage = document.getElementById('detail-page');
  document.getElementById('det-hdr-title').textContent = '載入中...';
  document.getElementById('det-body').innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text3);"><svg width="36" height="36" viewBox="0 0 40 40" style="animation:spin 1s linear infinite;" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="16" fill="none" stroke="#e0e0e0" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="60 44" stroke-linecap="round"/></svg></div>`;
  detPage.classList.add('open');

  try {
    // 從 gttData 直接取
    let train = gttData?.trains.find(t => t.no === trainNo);
    let delay = 0;

    if (!train && API_BASE) {
      const resp = await fetch(`${API_BASE}/api/train/${trainNo}`);
      const data = await resp.json();
      train = data; delay = data.delay || 0;
    } else if (API_BASE) {
      try {
        const lr = await fetch(`${API_BASE}/api/live`);
        const ld = await lr.json();
        const found = (ld.TrainLiveBoards || []).find(t => t.TrainNo === trainNo);
        delay = found?.DelayTime || 0;
      } catch(e) {}
    }

    if (!train) throw new Error('找不到列車資料');

    const ti = TYPE_INFO[train.type] || { label: '列車', cls: 'b-exp' };
    const atStop = train.stops.find(s => s.stn === atStation);
    const passTime = s1TimeOverride || (atStop ? (atStop.dep || atStop.arr) : '');
    const displayDir = calculateDisplayDir(train);

    // 兩站之間模式：顯示 s1→s2 時間
    const timeSection = isBetween && s2Station && s2TimeOverride
      ? `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <div>
            <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,0.8);margin-bottom:2px;">${atStation}</div>

    id, trainNo, station, passTime,
    type: train.type, label: ti.label,
    dir: train.dir,
    addedAt: Date.now(),
  };
  addReminder(reminder);
}

function calcDurStr(dep, arr) {
  if(!dep || !arr || dep==='??:??' || arr==='??:??') return '';
  const [dh,dm]=dep.split(':').map(Number);
  const [ah,am]=arr.split(':').map(Number);
  let mins=(ah*60+am)-(dh*60+dm);
  if(mins<0) mins+=1440;
  const h=Math.floor(mins/60), m=mins%60;
  if(h===0) return `${m}分`;
  return `${h}h${String(m).padStart(2,'0')}`;
}

async function searchTT(){
  const selectedTypes = getTTSelectedTypes();
  const el=document.getElementById('tt-results');
  const _now = new Date();
  const nowStr = tStr(_now.getHours(), _now.getMinutes());
  const dateVal = document.getElementById('tt-date').value;
  const isToday = dateVal === _now.toISOString().split('T')[0];

  const fromLbl = document.getElementById('tt-from-lbl');
  const toLbl   = document.getElementById('tt-to-lbl');
  const fromName = fromLbl.classList.contains('placeholder') ? '' : fromLbl.textContent;
  const toName   = toLbl.classList.contains('placeholder')   ? '' : toLbl.textContent;

  if (!fromName || !toName) {
    el.innerHTML = `<div style="background:var(--accent-lt);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:14px 16px;text-align:center;">
      <div style="font-size:15px;font-weight:600;color:var(--accent);margin-bottom:4px;">請先選擇車站</div>
      <div style="font-size:13px;color:var(--text2);">點上方「出發站」和「到達站」選擇查詢區間</div>
    </div>`;
    return;
  }

  if (API_BASE && fromName && toName) {
    el.innerHTML = `<div style="text-align:center;padding:2rem 0;color:var(--text3);">
      <svg width="40" height="40" viewBox="0 0 40 40" style="animation:spin 1s linear infinite;margin-bottom:8px;" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="16" fill="none" stroke="#e0e0e0" stroke-width="4"/>
        <circle cx="20" cy="20" r="16" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="60 44" stroke-linecap="round"/>
      </svg>
      <div style="font-size:14px;">查詢中...</div>
    </div>`;
    try {
      await ensureGTT();
      let liveMap = {};
      try {
        const lr = await fetch(`${API_BASE}/api/live`);
        const ld = await lr.json();
        (ld.TrainLiveBoards || []).forEach(t => { liveMap[t.TrainNo] = t.DelayTime || 0; });
      } catch(e) {}

      const alt = n => n.replace(/台/g,'臺').replace(/臺/g,'台');
      let list = [];
      for (const train of gttData.trains) {
        if (selectedTypes !== 'all' && !selectedTypes.includes(train.type)) continue;
        const i1 = train.stops.findIndex(s => s.stn === fromName || s.stn === alt(fromName));
        const i2 = train.stops.findIndex(s => s.stn === toName   || s.stn === alt(toName));
        if (i1 < 0 || i2 < 0 || i2 <= i1) continue;
        const depStop = train.stops[i1];
        const arrStop = train.stops[i2];
        const dep = depStop.dep || depStop.arr;
        const arr = arrStop.arr || arrStop.dep;
        if (ttNowMode && isToday && dep < nowStr) continue;
        list.push({
          no: train.no, type: train.type,
          dep, arr, dur: calcDurStr(dep, arr),
          delay: liveMap[train.no] || 0,
          from: train.from, to: train.to,
          stops: train.stops.map(s => ({
            s: s.stn, dep: s.dep || s.arr,
            late: liveMap[train.no] || 0,
            mj: MAJOR.has(s.stn),
          })),
        });
      }
      list.sort((a, b) => a.dep.localeCompare(b.dep));
      renderTTList(list, false);
      return;
    } catch(e) {
      el.innerHTML = `<div style="background:var(--red-lt);border:1px solid #ffcccc;border-radius:var(--radius-sm);padding:14px;color:var(--red);font-size:14px;">⚠️ 查詢失敗：${e.message}</div>`;
      return;
    }
  }

  // 假資料
  let list = TT_TRAINS.filter(t => selectedTypes === 'all' || selectedTypes.includes(t.type));
  if (ttNowMode) { const fut = list.filter(t => t.dep >= nowStr); if(fut.length) list = fut; }
  renderTTList(list, true);
}

    <div style="margin-bottom:8px;">
      <span class="badge ${ti.cls}" style="font-size:12px;padding:4px 11px;margin-bottom:10px;display:inline-block;">${ti.label}</span>
      <div class="det-no">${no}</div>
      <div class="det-route">${t.from} → ${t.to}</div>
    </div>
    <div class="det-time">${t.dep}</div>
    <div class="det-lbl">出發 · 抵達 ${t.arr}</div>
    <div class="card" style="margin-bottom:16px;">
      <div class="info-row"><span class="ik">行車時間</span><span class="iv">${t.dur}</span></div>
      <div class="info-row"><span class="ik">誤點</span><span class="iv" style="color:${t.delay>0?'var(--orange)':'var(--green)'}">${t.delay>0?'+'+t.delay+' 分':'準點'}</span></div>
    </div>
    <div class="act-btns"><button class="btn-s" onclick="closeDetail()">← 返回</button></div>`;
  document.getElementById('detail-page').classList.add('open');
}

// ===== FAVS =====
function renderFavs(){
  const el = document.getElementById('fav-list');
  if(!FAVS.length){
    el.innerHTML=`<div class="empty-state">
      <div class="empty-icon" style="display:flex;justify-content:center;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#dde6f5"/></svg>
      </div>
      <div class="empty-text">尚無收藏拍攝點</div>
      <div style="font-size:13px;color:var(--text3);margin-top:6px;">在拍車頁面查詢後可收藏常用地點</div>
    </div>`;
    return;
  }
  el.innerHTML=FAVS.map(f=>`
    <div class="fav-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;">
        <div>
          <div class="fav-name">${f.name}</div>
          <div class="fav-meta">${f.type==='between'?'兩站之間':'單一車站'} · ${f.loc}${f.pos?' · '+f.pos:''}</div>
        </div>
        <div style="width:36px;height:36px;border-radius:50%;background:var(--red-lt);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;" onclick="deleteFav(${f.id})">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="#d43030"/></svg>
        </div>
      </div>
      <div class="fav-tags">
        <div class="fav-tag">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" style="vertical-align:-1px;margin-right:3px;"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z" fill="currentColor"/></svg>
          ${f.timeRange}
        </div>
        <div class="fav-tag">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" style="vertical-align:-1px;margin-right:3px;"><rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/></svg>
          ${f.filter}
        </div>
      </div>
      <div class="fav-go" onclick="goFav(${f.id})">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;margin-right:4px;"><path d="M12 15.2A3.2 3.2 0 0 1 8.8 12 3.2 3.2 0 0 1 12 8.8 3.2 3.2 0 0 1 15.2 12 3.2 3.2 0 0 1 12 15.2M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9z" fill="currentColor"/></svg>
        前往拍車
      </div>
    </div>`).join('');
}
function deleteFav(id){
  if(!confirm('確定移除此收藏？')) return;
  const idx = FAVS.findIndex(f=>f.id===id);
  if(idx>-1) FAVS.splice(idx,1);
  renderFavs();
}
function openAddFavHint(){
  alert('請在「拍車」頁面查詢列車後，點選列車詳細頁面的「收藏此拍攝點」按鈕');
}
function goFav(id){
  const f=FAVS.find(x=>x.id===id);
  if(!f) return;
  document.getElementById('loc-display').textContent=f.loc;
  document.getElementById('loc-mode-display').textContent=f.type==='between'?'兩站之間':'單一車站';
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-shoot').classList.add('active');
  document.getElementById('tbtn-shoot').classList.add('active');
setTimeout(doSearch,80);
}

// ===== REMINDERS =====
function setReminder(tid){
  const t=TRAINS.find(x=>x.id===tid);if(!t)return;
  const ti=TYPE_INFO[t.type];
  if(reminders.find(r=>r.tid===tid&&r.status==='waiting')){alert('已設定此提醒');return;}
  const[ph,pm]=t.passTime.split(':').map(Number);
  const ra=new Date(NOW);ra.setHours(ph,pm-5,0,0);
  reminders.push({id:Date.now(),tid,label:ti.label+' '+t.no,time:t.passTime,
    loc:document.getElementById('loc-display').textContent,remindAt:ra.getTime(),status:'waiting'});
  saveR();updateBell();
  alert('已設定提醒\n'+ti.label+' '+t.no+'\n通過前 5 分鐘提醒');
}
function renderBell(){
  const[w,n,e]=[reminders.filter(r=>r.status==='waiting'),reminders.filter(r=>r.status==='notified'),reminders.filter(r=>r.status==='expired')];
  let h='';
  if(w.length){h+='<div class="bell-sec">等待中</div>'+w.map(r=>`<div class="bell-item"><div class="bell-top"><div class="bdot w"></div><div class="btrain">${r.label}</div><div class="bstat w">等待</div></div><div class="binfo">${r.time} · ${r.loc}</div></div>`).join('');}
  if(n.length){h+='<div class="bell-sec">已提醒</div>'+n.map(r=>`<div class="bell-item"><div class="bell-top"><div class="bdot n"></div><div class="btrain">${r.label}</div><div class="bstat n">已提醒</div></div><div class="binfo">${r.time} · ${r.loc}</div></div>`).join('');}
  if(e.length){h+='<div class="bell-sec">已過期略過</div>'+e.map(r=>`<div class="bell-item"><div class="bell-top"><div class="bdot e"></div><div class="btrain">${r.label}</div><div class="bstat e">已過期</div></div><div class="binfo">${r.time} · ${r.loc} · 已略過</div></div>`).join('');}
  if(!h)h='<div class="empty-state" style="padding:2rem 0;"><div class="empty-icon" style="display:flex;justify-content:center;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#8a9db8"/></svg></div><div class="empty-text">尚無提醒</div></div>';
  document.getElementById('bell-body').innerHTML=h;
}
function checkReminders(){
  const n=Date.now();
  reminders.forEach(r=>{
    if(r.status!=='waiting')return;
    if(n<r.remindAt)return;
    const[ph,pm]=r.time.split(':').map(Number);
    const pt=new Date(NOW);pt.setHours(ph,pm,0,0);
    if(n>=pt.getTime())r.status='expired';
    else{alertQueue.push(r);r.status='notified';}
    saveR();updateBell();
  });
  if(!currentAlert&&alertQueue.length)showNextAlert();
}
function showNextAlert(){
  while(alertQueue.length){
    const r=alertQueue.shift();
    const[ph,pm]=r.time.split(':').map(Number);
    const pt=new Date(NOW);pt.setHours(ph,pm,0,0);
    if(Date.now()>=pt.getTime())continue;
    currentAlert=r;
    document.getElementById('al-title').textContent=r.label+' 即將經過';
    document.getElementById('al-sub').textContent='預計 5 分鐘後通過\n'+r.loc;
    document.getElementById('alert-ov').classList.add('open');
    return;
  }
}
function dismissAlert(){document.getElementById('alert-ov').classList.remove('open');currentAlert=null;setTimeout(()=>{if(alertQueue.length)showNextAlert();},300);}
function alertDetail(){document.getElementById('alert-ov').classList.remove('open');if(currentAlert)openDetail(currentAlert.tid);currentAlert=null;}

// ===== INIT =====
document.getElementById('tt-date').valueAsDate=new Date();
// 現在時刻預設開啟
document.getElementById('tt-now-btn').classList.add('active');
setLocMode('single');
updateBell();
setInterval(checkReminders,30000);
checkReminders();
</script>
